[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atslang"
version = "0.7.0"
description = "ATSLang: Türkçe anahtar kelimeli, genel amaçlı programlama dili"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "ATS Creative Media" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ats = "atslang.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# OneDrive klasörlerinde pytest önbelleği oluşturulamıyor; önbelleğe gerek yok.
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
